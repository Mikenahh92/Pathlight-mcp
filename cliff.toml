# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog header.
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
body = """
{% if version -%}
    {%- if previous.version -%}
        ## [{{ version | trim_start_matches(pat="v") }}]\
 (https://github.com/Mikenahh92/Guidewire/compare/{{ previous.version }}..{{ version }}) — {{ timestamp | date(format="%Y-%m-%d") }}
    {%- else -%}
        ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
    {%- endif -%}
{%- else -%}
    ## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (**BREAKING**){% endif %}\

{% endfor -%}
{% endfor %}
"""
# Remove leading and trailing whitespace from the body.
trim = true
# Postprocessors to modify the final changelog.
postprocessors = [
    { pattern = "<REPO_URL>", replace = "https://github.com/Mikenahh92/Guidewire" },
]

[git]
# Parse the commit messages as conventional commits.
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# Preprocessors to modify commit messages before parsing.
commit_preprocessors = [
    # Normalize squash-merge message format:
    # "Merge GW-XXX: feat(scope): description" → "feat(scope): description"
    { pattern = 'Merge \w+-\d+:\s+', replace = "" },
    # Normalize squash-merge messages without conventional prefix:
    # "Merge GW-XXX: Add something" → "feat: Add something"
    { pattern = '^(Add|Create|Implement|Introduce)\b', replace = "feat: " },
    { pattern = '^(Fix|Resolve|Repair)\b', replace = "fix: " },
    { pattern = '^(Refactor|Rename|Reorganize|Restructure)\b', replace = "refactor: " },
    { pattern = '^(Update|Improve|Enhance|Modernize)\b', replace = "refactor: " },
    { pattern = '^(Document|Docs?)\b', replace = "docs: " },
    { pattern = '^(Test)\b', replace = "test: " },
    { pattern = '^(Hotfix)\b', replace = "fix: " },
    # Link GW-XXX issue references.
    { pattern = '\((#\w+-\d+)\)', replace = "([${1}](<REPO_URL>/issues/${1}))" },
    { pattern = '(#GW-(\d+))', replace = "[${1}](<REPO_URL>/issues/${1})" },
]
# Parsers to assign commits to groups based on conventional commit type.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^perf", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^test", group = "Added" },
    { message = "^chore|^ci", skip = true },
    { message = "^revert", group = "Fixed" },
    { body = ".*security", group = "Fixed" },
]
# Prevent breaking commits from being excluded.
protect_breaking_commits = true
# Include commits not matched by any parser.
filter_commits = true
# Tag pattern for releases.
tag_pattern = "v[0-9].*"
# Sort commits within each release.
sort_commits = "newest"
