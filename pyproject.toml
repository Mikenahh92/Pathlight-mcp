[build-system]
requires = ["setuptools>=75.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "guidewire"
dynamic = ["version"]
description = "Desktop Accessibility MCP — a Playwright-like MCP for non-browser desktop applications powered by OS accessibility APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Mikenahh92" },
]
keywords = ["mcp", "accessibility", "desktop-automation", "uia", "a11y"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Topic :: Accessibility",
    "Framework :: MCP",
    "Typing :: Typed",
]

dependencies = [
    "mcp",
    "python-xlib; sys_platform == 'linux'",
    "websocket-client>=1.6",
]

[project.urls]
Homepage = "https://github.com/Mikenahh92/Guidewire"
Documentation = "https://github.com/Mikenahh92/Guidewire#readme"
Changelog = "https://github.com/Mikenahh92/Guidewire/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Mikenahh92/Guidewire/issues"
"Source Code" = "https://github.com/Mikenahh92/Guidewire"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "packaging>=24.0",
]
integration = [
    "anthropic>=0.40.0",
]
windows = [
    "comtypes>=1.4",
]

[project.scripts]
guidewire = "guidewire.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
omit = ["src/guidewire/__main__.py"]
