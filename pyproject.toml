[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pathlight-mcp"
dynamic = ["version"]
description = "Desktop Accessibility MCP — a Playwright-like MCP for non-browser desktop applications powered by OS accessibility APIs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    { name = "Mikenahh92" },
]
keywords = ["mcp", "accessibility", "desktop-automation", "uia", "a11y"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "mcp",
    "comtypes>=1.4; sys_platform == 'win32'",
    "python-xlib; sys_platform == 'linux'",
    "websocket-client>=1.6",
    "mss>=9.0",
]

[project.urls]
Homepage = "https://github.com/Mikenahh92/Guidewire"
Documentation = "https://github.com/Mikenahh92/Guidewire#readme"
Changelog = "https://github.com/Mikenahh92/Guidewire/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Mikenahh92/Guidewire/issues"
"Source Code" = "https://github.com/Mikenahh92/Guidewire"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "packaging>=24.0",
    "pathlight-mcp[visual]",
]
integration = [
    "anthropic>=0.40.0",
]
visual = [
    "rapidocr-onnxruntime>=1.2",
]

[project.scripts]
pathlight-mcp = "pathlight_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = '0.0.0'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
omit = ["src/pathlight_mcp/__main__.py"]
