name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write  # OIDC trusted publishing + SLSA provenance

jobs:
  # ── 1. Security scan ─────────────────────────────────────────────────
  security-scan:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install build pip-audit
          pip install -e ".[dev]"
      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner off

  # ── 2. CI gate ───────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check CI status on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ github.sha }}"
          echo "Checking CI status for commit $COMMIT_SHA ..."

          # Poll CI workflow runs for the tagged commit
          MAX_ATTEMPTS=60
          WAIT_SECONDS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(gh api \
              "repos/{owner}/{repo}/actions/runs?head_sha=$COMMIT_SHA&status=completed&per_page=5" \
              --jq '.workflow_runs[] | select(.name == "CI") | .conclusion' \
              | head -1)

            if [ -n "$STATUS" ]; then
              echo "CI run found with conclusion: $STATUS"
              if [ "$STATUS" = "success" ]; then
                echo "✅ CI passed for $COMMIT_SHA"
                exit 0
              else
                echo "❌ CI concluded with: $STATUS"
                exit 1
              fi
            fi

            echo "No completed CI run found yet (attempt $i/$MAX_ATTEMPTS), waiting ${WAIT_SECONDS}s ..."
            sleep $WAIT_SECONDS
          done

          echo "❌ Timed out waiting for CI to complete on $COMMIT_SHA"
          exit 1

  # ── 3. Build ─────────────────────────────────────────────────────────
  build:
    name: Build distribution
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools-scm and git-cliff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Generate subject hash for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          hashes=$(sha256sum * | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 4. SLSA provenance ───────────────────────────────────────────────
  provenance:
    name: Generate SLSA provenance
    needs: build
    permissions:
      contents: write
      id-token: write  # required for SLSA signing
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      compile-generator: true

  # ── 5. Publish to PyPI (OIDC trusted publishing) ──────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guidewire/
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── 6. Post-publish verification ──────────────────────────────────────
  verify-pypi:
    name: Verify PyPI install
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned version from PyPI
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          echo "Installing guidewire==$VERSION from PyPI ..."

          # Retry loop to allow PyPI propagation
          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            if pip install "guidewire==$VERSION" --no-cache-dir 2>/dev/null; then
              echo "✅ Installed guidewire==$VERSION"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "❌ Failed to install guidewire==$VERSION after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Package not yet available on PyPI (attempt $i/$MAX_RETRIES), retrying in 30s ..."
            sleep 30
            pip cache purge 2>/dev/null || true
          done
      - name: Verify version matches tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_VERSION#v}"
          INSTALLED=$(python -c "import importlib.metadata; print(importlib.metadata.version('guidewire'))")
          echo "Tag version:   $VERSION"
          echo "Installed:     $INSTALLED"
          if [ "$INSTALLED" != "$VERSION" ]; then
            echo "❌ Version mismatch: expected $VERSION, got $INSTALLED"
            exit 1
          fi
          echo "✅ Version matches"
      - name: Verify imports
        run: |
          python -c "import guidewire; print(f'guidewire {guidewire.__version__} installed from PyPI')"
          python -c "from guidewire.backends import MockBackend; print('Backend import OK')"

  # ── 7. Changelog and GitHub Release ──────────────────────────────────
  release:
    name: Update changelog and release
    needs: verify-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit and push changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          set +e
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git main
      - name: Create or update GitHub Release
        if: steps.git-cliff.outputs.content != ''
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ github.ref_name }}';
            const body = `${{ steps.git-cliff.outputs.content }}`;
            const { owner, repo } = context.repo;

            // Try to find an existing draft release for this tag
            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });
            const existing = releases.data.find(r => r.tag_name === tag);

            if (existing) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.id,
                body,
                draft: false
              });
              core.info(`Updated existing release for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: tag,
                body,
                draft: false,
                prerelease: false
              });
              core.info(`Created new release for ${tag}`);
            }
