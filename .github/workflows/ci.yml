name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools-scm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --tb=short -q --ignore=tests/integration

  web-integration:
    name: Web Backend Integration (Headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Launch headless Chrome with remote debugging
        run: |
          google-chrome --headless=new --remote-debugging-port=9222 \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/chrome-ci about:blank &
          # Wait for Chrome to start listening
          for i in $(seq 1 30); do
            if curl -s http://localhost:9222/json/version > /dev/null 2>&1; then
              echo "Chrome is ready on port 9222"
              break
            fi
            echo "Waiting for Chrome... ($i/30)"
            sleep 1
          done
      - name: Run web backend integration tests
        run: pytest --tb=short -q -k "web" --ignore=tests/integration
        env:
          CDP_HOST: localhost
          CDP_PORT: "9222"
      - name: Stop Chrome
        if: always()
        run: |
          pkill -f "chrome.*remote-debugging-port" || true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install build twine
      - name: Build package
        run: python -m build
      - name: Check package with twine
        run: twine check dist/*

  ci-pass:
    name: CI Passed
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, test, web-integration, build-check]
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.web-integration.result }}" != "success" || "${{ needs.build-check.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
