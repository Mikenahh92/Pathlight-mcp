name: Question
description: Ask a question about using or understanding Pathlight MCP
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about Pathlight MCP? We are happy to help!

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: What area is your question about?
      options:
        - installation
        - usage
        - development
        - architecture
        - other
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: Describe what you would like to know.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Any relevant context: what you are trying to achieve, code samples,
        configuration, or error messages.

  - type: input
    id: pathlight-mcp-version
    attributes:
      label: Pathlight MCP Version
      description: What version of Pathlight MCP are you using?
      placeholder: e.g. 0.3.0

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux (X11)
        - Linux (Wayland)
        - macOS
        - Other
